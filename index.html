<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برای پارمیس من</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Vazirmatn', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #4a0e2e;
        }

        #content-box {
            width: 85%;
            text-align: center;
            position: relative;
        }

        .text-slide {
            font-size: 1.4rem;
            line-height: 2;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.6);
        }

        .show-text {
            opacity: 1;
        }

        #timer-box {
            font-size: 4rem;
            font-weight: bold;
            color: #d81b60;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-shadow: 2px 2px 5px rgba(255,255,255,0.8);
        }

        #start-btn {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
            position: absolute;
            z-index: 10;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        /* یه افکت قلب کوچیک برای پس زمینه */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: floatup 6s infinite linear;
        }
        @keyframes floatup {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- دکمه شروع -->
    <button id="start-btn">برای شروع این دکمه رو بزن زندگیممم</button>

    <div id="content-box">
        <div id="text-display" class="text-slide"></div>
        <div id="timer-box">10</div>
    </div>

    <script>
        // اضافه کردن قلب‌های شناور به پس‌زمینه
        for(let i=0; i<15; i++) {
            let heart = document.createElement('div');
            heart.innerHTML = '💙';
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(heart);
        }

        // بخش‌بندی متن‌های شما
        const scriptData = [
            "خببب خبببب<br>سلام فرشته کوچولوی زندگیممم<br>دوستتتتت دارمممممم عاشقتممم",
            "الان که داری این متنو میخونی<br>تو روبه روی من نشستی<br>و من همین الان دارم نگات میکنم",
            "ببیننن بخدااا الان تو<br>حقحقمقمقجبجبمبمبنمقیکیکیمیمیمی ترین<br>شرایطمم",
            "دارم بهت نگاه میکنم و با خودم میگم<br>چطوری ممکنه یه نفر<br>انقدهههه قشنگ باشهه؟؟",
            "انقده ناززز باشهه<br>همینقدر ادم دلش بخواد فقط نگاهش کنه<br>و هی تو دلش بگه:",
            "این دختر واقعا مال منه:))؟",
            "پارمیسی جونم<br>اگه بدونی چقدر دوستت دارم بخداا<br>اگه بدونی چقدد عاشقتمم",
            "یه جوری دوستت دارم که<br>توی خیلی از قشنگ ترین لحظه های زندگیم<br>اولین چیزی که دلم میخواد...",
            "اینه که تو کنارم باشی<br>که بخندی<br>که غر بزنی",
            "دعوام کنی<br>کتکم بزنی<br><span style='font-size:0.9rem'>(نمیدونم واقعا تا الان کتکم زدی یا نه)</span>",
            "و میدونی قشنگ ترین قسمتش چیه؟ بچمم",
            "اینکه من الان<br>بعد همه اون حرفا<br>همه خنده ها",
            "همه بحثاا<br>همه اشتیی کردنا<br>همه دلتنگیا",
            "همه ببخشید گفتنا:)<br>همه عاشقتم گفتنا…",
            "الان تو رو دارم روبه روم…",
            "و فقط دلم میخواد چند لحظه<br>همینجوری نگات کنم<br>بدون اینکه چیزی بگم…",
            "خبببب ولی الان من دارم زیادی احساسی میشم 😭😂",
            "این کاریم که داشتم نوشتن این متن ها<br>و ساختن این سایت بودشش<br>عاشقتمممم پارمیسسس جونم",
            "پس قبل اینکه ادامه بدم<br>یه کار خیلی مهم داری<br>ده ثانیه وقت داری",
            "باید همین الان بهم بگی:<br><br>«دوستت دارمممم»<br>هاهاهااااااا",
            "[TIMER]",
            "خبببب<br>حالا برای اینکه تعادل روانی من حفظ بشه 😂<br>باید با همون لحن خودت بگی:",
            "«هیچم خوشم ازت نیمیاد»",
            "[TIMER]",
            "الان مثل شاسگولا زل زدم بهت<br>داری اینارو میخونیی 🫠😂😂😂",
            "ولی حالا جدی<br>پارمیس من<br>بدون تو میمیرم",
            "همه زندگیم فکرم ایندم<br>همه قشنگیای زندگیم<br>خلاصه شده تو این خانوم کوچولوی ماه",
            "کد بانووو<br>فرشتهههه<br>هنرمنددد<br>خوشگلللل",
            "خببببببب<br>دیگه قبل اینکه واقعا سکته کنم از بس قشنگی 😂",
            "وقتشه کادوتو باز کنییی بچممم<br><br>ببینم برای فرشته کوچولوی زندگیم چی کادو گرفتمم )"
        ];

        let currentIndex = 0;
        const textDisplay = document.getElementById('text-display');
        const timerBox = document.getElementById('timer-box');
        const startBtn = document.getElementById('start-btn');

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            playSequence();
        });

        function playSequence() {
            if (currentIndex >= scriptData.length) return; // پایان

            let content = scriptData[currentIndex];

            if (content === "[TIMER]") {
                // مخفی کردن متن و نمایش تایمر
                textDisplay.classList.remove('show-text');
                
                setTimeout(() => {
                    timerBox.style.opacity = 1;
                    let timeLeft = 10;
                    timerBox.innerText = timeLeft;

                    let countdown = setInterval(() => {
                        timeLeft--;
                        timerBox.innerText = timeLeft;
                        
                        if (timeLeft <= 0) {
                            clearInterval(countdown);
                            timerBox.style.opacity = 0;
                            setTimeout(() => {
                                currentIndex++;
                                playSequence();
                            }, 1000); // صبر برای محو شدن تایمر
                        }
                    }, 1000);
                }, 1500); // صبر برای محو شدن متن قبلی
                
            } else {
                // نمایش متن
                textDisplay.innerHTML = content;
                textDisplay.classList.add('show-text');

                // محاسبه زمان نمایش بر اساس طول متن (هر حرف حدود 80 میلی ثانیه + 2.5 ثانیه پایه)
                // حداقل زمان 3.5 ثانیه
                let displayTime = Math.max(2000, content.length * 40 + 2500);

                setTimeout(() => {
                    textDisplay.classList.remove('show-text');
                    setTimeout(() => {
                        currentIndex++;
                        playSequence();
                    }, 500); // 1.5 ثانیه صفحه خالی میمونه تا جمله بعدی بیاد
                }, displayTime);
            }
        }
    </script>
</body>
</html>
